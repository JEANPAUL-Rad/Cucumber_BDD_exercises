name: nightly buildd at 12pm

on: 
 push: 
 schedule:
   - cron: '59 16 * * *'

jobs:
  nightly_build:
   runs-on: ubuntu-latest
   steps:
     - name: run Unit Tests
       run: mvn test

     - name: Build with Maven
       run: mvn -DskipTests -B package --no-transfer-progress --file ./pom.xml
     - uses: actions/upload-artifact@master
       with:
          name: digibank.war
          path: ./target/*digitalbank*.war
       
